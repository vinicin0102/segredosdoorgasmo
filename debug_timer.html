<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBUG TIMER - 8m 55s</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles-extra.css">
    <style>
        body {
            background: #000;
            color: #fff;
            text-align: center;
        }

        .debug-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: yellow;
            padding: 10px;
            z-index: 9999;
            font-family: monospace;
            font-size: 1.2rem;
            border-bottom: 2px solid red;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
        }

        .log-box {
            text-align: left;
            font-size: 0.8rem;
            color: #ccc;
            margin-top: 5px;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

    <div class="debug-overlay">
        <div>TEMPO DECORRIDO:</div>
        <div class="timer-display" id="timer">00:00</div>
        <div style="color: #4ade80;">ALVO: 08:55 (535s)</div>
        <div class="log-box" id="log"></div>
    </div>

    <div style="margin-top: 150px; padding: 20px;">
        <h1>MODO DE CALIBRAÇÃO</h1>
        <p>Use esta tela para verificar a sincronia exata.</p>

        <!-- VSL VIDEO CONTAINER (VTurb) -->
        <div class="video-container" style="margin: 20px auto; max-width: 100%;">
            <vturb-smartplayer id="vid-69761053d186076a68574eb1"
                style="display: block; margin: 0 auto; width: 100%; max-width: 100%;"></vturb-smartplayer>
            <script
                type="text/javascript"> var s = document.createElement("script"); s.src = "https://scripts.converteai.net/24441899-4a63-4111-ae3a-467e00f4dc2c/players/69761053d186076a68574eb1/v4/player.js", s.async = !0, document.head.appendChild(s); </script>
        </div>

        <!-- OFERTA REAL -->
        <div id="offer-content"
            style="display: none; opacity: 0; transition: opacity 1s ease-in-out; margin-top: 30px;">
            <!-- Box de Preço Destacado -->
            <div class="price-box"
                style="background: rgba(220, 38, 38, 0.1); border: 2px solid #dc2626; border-radius: 15px; padding: 25px; margin-bottom: 25px;">
                <span class="new-price"
                    style="display: block; font-size: 2.5rem; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); margin: 5px 0;">A
                    OFERTA APARECEU!</span>
            </div>
            <a href="#" class="btn-red btn-cta pulse" style="padding: 20px; display:block;">BOTÃO DE COMPRA</a>
        </div>
    </div>

    <script>
        const TARGET_SECONDS = 5; // 5 segundos para teste

        const timerDisplay = document.getElementById('timer');
        const log = document.getElementById('log');
        const offerContent = document.getElementById('offer-content');

        const startTime = Date.now();

        function updateTimer() {
            const elapsedMs = Date.now() - startTime;
            const elapsedSec = Math.floor(elapsedMs / 1000);

            const m = Math.floor(elapsedSec / 60).toString().padStart(2, '0');
            const s = (elapsedSec % 60).toString().padStart(2, '0');

            timerDisplay.innerText = `${m}:${s}`;

            // Logar a cada minuto
            if (elapsedSec > 0 && elapsedSec % 60 === 0) {
                // log.innerHTML += `<div>${m}:${s} - Rodando...</div>`;
            }

            if (elapsedSec >= TARGET_SECONDS) {
                timerDisplay.style.color = '#4ade80'; // Verde
                document.querySelector('.debug-overlay').style.borderColor = '#4ade80';

                if (offerContent.style.display === 'none') {
                    offerContent.style.display = 'block';
                    setTimeout(() => offerContent.style.opacity = '1', 100);
                    log.innerHTML += `<div style="color:red; font-weight:bold;">DISPAROU EM: ${m}:${s}</div>`;
                }
            } else {
                requestAnimationFrame(updateTimer);
            }
        }

        requestAnimationFrame(updateTimer);
    </script>
</body>

</html>
